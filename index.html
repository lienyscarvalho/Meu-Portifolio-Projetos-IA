<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LC Consultoria — Portfolio Manager</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#C9A84C;--gl:#E8C97A;--gd:#9A7A32;
  --bk:#0A0A0A;--b2:#111111;--b3:#1A1A1A;--b4:#222222;
  --w:#FAFAFA;--w2:#F0EDE6;--gray:#888;--gray-l:#CCC;
  --red:#C0392B;--green:#27AE60;
  --bd:rgba(201,168,76,0.18);--shadow:0 8px 40px rgba(0,0,0,0.5);
}
html,body,#root{min-height:100vh}
body{font-family:'Montserrat',sans-serif;background:var(--bk);color:var(--w);-webkit-font-smoothing:antialiased}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:64px;background:rgba(10,10,10,0.95);border-bottom:1px solid var(--bd);backdrop-filter:blur(12px)}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:700;color:var(--g)}
.logo span{color:var(--w);font-weight:300}
.nav-tabs{display:flex;gap:4px}
.nav-tab{padding:6px 16px;border-radius:4px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border:none;background:transparent;color:var(--gray);transition:all .2s;font-family:'Montserrat',sans-serif}
.nav-tab:hover{color:var(--gl)}
.nav-tab.active{background:var(--g);color:var(--bk)}
.btn-new{display:flex;align-items:center;gap:6px;padding:9px 20px;border-radius:4px;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border:none;background:var(--g);color:var(--bk);font-family:'Montserrat',sans-serif;transition:all .2s}
.btn-new:hover{background:var(--gl);transform:translateY(-1px)}
main{padding:88px 32px 60px;max-width:1400px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.stat{background:var(--b3);border:1px solid var(--bd);border-radius:8px;padding:20px 24px}
.stat-v{font-family:'Cormorant Garamond',serif;font-size:2.5rem;font-weight:700;color:var(--g);line-height:1}
.stat-l{font-size:.7rem;color:var(--gray);letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-top:4px}
.filter-bar{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:220px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--gray);pointer-events:none}
.search-inp{width:100%;padding:10px 12px 10px 40px;background:var(--b3);border:1px solid var(--bd);border-radius:6px;color:var(--w);font-family:'Montserrat',sans-serif;font-size:.85rem;outline:none;transition:border-color .2s}
.search-inp:focus{border-color:var(--g)}
.fsel{padding:10px 14px;background:var(--b3);border:1px solid var(--bd);border-radius:6px;color:var(--w);font-family:'Montserrat',sans-serif;font-size:.82rem;outline:none;cursor:pointer}
.fsel:focus{border-color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.card{background:var(--b3);border:1px solid var(--bd);border-radius:10px;padding:24px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gd),var(--gl));opacity:0;transition:opacity .2s}
.card:hover{border-color:var(--g);transform:translateY(-3px);box-shadow:var(--shadow)}
.card:hover::before{opacity:1}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.type-badge{padding:3px 10px;border-radius:3px;font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:rgba(201,168,76,.12);color:var(--g);border:1px solid var(--bd)}
.card-acts{display:flex;gap:6px}
.act-btn{width:30px;height:30px;border-radius:4px;border:none;background:var(--b4);color:var(--gray);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.act-btn:hover{background:var(--g);color:var(--bk)}
.act-btn.del:hover{background:var(--red);color:#fff}
.card-title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:700;color:var(--w);margin-bottom:4px;line-height:1.2}
.card-area{font-size:.75rem;color:var(--gray);margin-bottom:14px}
.plbl{display:flex;justify-content:space-between;font-size:.7rem;color:var(--gray);margin-bottom:5px}
.plbl span:last-child{color:var(--g);font-weight:700}
.ptrack{height:5px;background:var(--b4);border-radius:3px;overflow:hidden}
.pfill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gd),var(--gl));transition:width .5s}
.sbadge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:.66rem;font-weight:700;margin-top:10px}
.s-run{background:rgba(39,174,96,.15);color:#2ecc71;border:1px solid rgba(39,174,96,.3)}
.s-prog{background:rgba(201,168,76,.12);color:var(--g);border:1px solid var(--bd)}
.s-pau{background:rgba(192,57,43,.15);color:#e74c3c;border:1px solid rgba(192,57,43,.3)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.card-meta{display:flex;gap:16px;margin-top:10px;font-size:.7rem;color:var(--gray)}
.empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--gray)}
.empty-t{font-family:'Cormorant Garamond',serif;font-size:1.8rem;color:var(--w2);margin:16px 0 8px}
/* MODAL */
.overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.88);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px}
.modal{background:var(--b2);border:1px solid var(--bd);border-radius:12px;width:100%;max-width:900px;box-shadow:0 20px 80px rgba(0,0,0,.8);animation:su .3s ease}
@keyframes su{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:24px 28px;border-bottom:1px solid var(--bd)}
.mtitle{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:700;color:var(--g)}
.mclose{width:36px;height:36px;border-radius:6px;border:1px solid var(--bd);background:transparent;color:var(--gray);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.mclose:hover{background:var(--red);color:#fff;border-color:var(--red)}
.mbody{padding:28px;max-height:72vh;overflow-y:auto}
.mfoot{display:flex;gap:12px;justify-content:flex-end;padding:20px 28px;border-top:1px solid var(--bd)}
.fsec{margin-bottom:28px}
.fsec-t{font-size:.68rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--g);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.fgrp{display:flex;flex-direction:column;gap:5px}
.flbl{font-size:.7rem;font-weight:600;letter-spacing:.06em;color:var(--gray);text-transform:uppercase}
.finp,.fsel2,.ftxt{padding:10px 14px;background:var(--b4);border:1px solid var(--bd);border-radius:6px;color:var(--w);font-family:'Montserrat',sans-serif;font-size:.85rem;outline:none;transition:border-color .2s;width:100%}
.finp:focus,.fsel2:focus,.ftxt:focus{border-color:var(--g)}
.ftxt{resize:vertical;min-height:80px}
.cl-wrap{overflow-x:auto}
.cl-table{width:100%;border-collapse:collapse;font-size:.82rem}
.cl-table th{padding:10px 14px;text-align:left;font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--g);border-bottom:1px solid var(--bd);background:var(--b4)}
.cl-table td{padding:10px 14px;border-bottom:1px solid rgba(201,168,76,.07);vertical-align:middle}
.cl-table tr:hover td{background:rgba(201,168,76,.04)}
.cat-b{padding:2px 8px;border-radius:3px;font-size:.6rem;font-weight:700;background:rgba(201,168,76,.1);color:var(--gd);border:1px solid var(--bd)}
.sb-wrap{display:flex;gap:6px;justify-content:center}
.sb{width:32px;height:32px;border-radius:5px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.sb-y{background:rgba(39,174,96,.1);color:#27ae60;border:1px solid rgba(39,174,96,.3)}
.sb-y.on{background:#27ae60;color:#fff}
.sb-n{background:rgba(192,57,43,.1);color:#c0392b;border:1px solid rgba(192,57,43,.3)}
.sb-n.on{background:#c0392b;color:#fff}
.obs-i{width:100%;padding:6px 10px;background:var(--bk);border:1px solid var(--bd);border-radius:4px;color:var(--w);font-family:'Montserrat',sans-serif;font-size:.78rem;outline:none;transition:border-color .2s}
.obs-i:focus{border-color:var(--g)}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 22px;border-radius:5px;border:none;font-family:'Montserrat',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .2s}
.btn-g{background:var(--g);color:var(--bk)}
.btn-g:hover{background:var(--gl);transform:translateY(-1px)}
.btn-o{background:transparent;color:var(--g);border:1px solid var(--bd)}
.btn-o:hover{border-color:var(--g);background:rgba(201,168,76,.08)}
.btn-d{background:var(--red);color:#fff}
.btn-d:hover{background:#e74c3c}
/* ABOUT */
.about-hero{display:flex;gap:48px;align-items:flex-start;padding:40px 0;border-bottom:1px solid var(--bd);margin-bottom:40px}
.photo-wrap{flex-shrink:0;width:180px;height:220px;border-radius:10px;overflow:hidden;border:2px solid var(--g);box-shadow:0 0 40px rgba(201,168,76,.2)}
.photo{width:100%;height:100%;object-fit:cover;object-position:top}
.aname{font-family:'Cormorant Garamond',serif;font-size:2.8rem;font-weight:700;color:var(--w);line-height:1;margin-bottom:6px}
.arole{font-size:.78rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--g);margin-bottom:16px}
.abio{font-size:.88rem;color:var(--gray-l);line-height:1.8;margin-bottom:20px}
.contacts{display:flex;gap:10px;flex-wrap:wrap}
.clink{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:5px;background:var(--b3);border:1px solid var(--bd);color:var(--gray-l);font-size:.76rem;font-weight:500;text-decoration:none;transition:all .2s}
.clink:hover{border-color:var(--g);color:var(--g)}
.skills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:40px}
.skill-card{background:var(--b3);border:1px solid var(--bd);border-radius:8px;padding:16px 20px}
.skill-t{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--g);margin-bottom:8px}
.stag{display:inline-block;padding:3px 9px;margin:3px 3px 0 0;border-radius:3px;font-size:.66rem;font-weight:600;background:var(--b4);color:var(--gray-l);border:1px solid rgba(255,255,255,.06)}
.sec-t{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:700;color:var(--w);margin-bottom:20px}
.sec-t span{color:var(--g)}
.gold-div{height:1px;background:linear-gradient(90deg,transparent,var(--g),transparent);margin:32px 0}
.exp-card{background:var(--b3);border:1px solid var(--bd);border-radius:10px;padding:20px 24px;margin-bottom:14px}
.exp-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.exp-co{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:700;color:var(--w)}
.exp-per{font-size:.7rem;color:var(--g);font-weight:700;letter-spacing:.1em}
.exp-hl{font-size:.82rem;color:var(--gray-l);line-height:1.6}
/* CONFIRM */
.conf-ov{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center}
.conf-box{background:var(--b2);border:1px solid var(--bd);border-radius:10px;padding:32px;max-width:380px;width:90%;text-align:center}
.conf-t{font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:var(--w);margin-bottom:10px}
.conf-m{font-size:.85rem;color:var(--gray);margin-bottom:24px}
.conf-btns{display:flex;gap:12px;justify-content:center}
/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;z-index:400;background:var(--b3);border:1px solid var(--g);border-radius:8px;padding:12px 20px;font-size:.82rem;color:var(--g);font-weight:600;animation:tin .3s ease}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
/* FOOTER */
.footer{border-top:1px solid var(--bd);padding:20px 32px;display:flex;align-items:center;justify-content:space-between;font-size:.72rem;color:var(--gray);flex-wrap:wrap;gap:10px}
.footer-b{color:var(--g);font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:700}
/* MOBILE */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--b2);border-top:1px solid var(--bd);padding:10px 16px;justify-content:space-around}
.mob-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;color:var(--gray);font-size:.58rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;transition:color .2s;font-family:'Montserrat',sans-serif}
.mob-btn.active{color:var(--g)}
/* VIEW MODAL */
.view-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:24px}
.view-item{background:var(--b4);border:1px solid var(--bd);border-radius:7px;padding:12px 14px}
.view-lbl{font-size:.63rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--g);margin-bottom:5px}
.view-val{font-size:.85rem;color:var(--w2)}
@media(max-width:768px){
  .nav{padding:0 16px}
  .nav-tabs{display:none}
  main{padding:80px 16px 90px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:1fr}
  .about-hero{flex-direction:column;gap:24px}
  .aname{font-size:2rem}
  .photo-wrap{width:140px;height:170px}
  .mob-nav{display:flex}
  .overlay{padding:0;align-items:flex-end}
  .modal{border-radius:12px 12px 0 0}
  .footer{justify-content:center;text-align:center}
  .stats .stat:nth-child(n+3){display:none}
}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bk)}
::-webkit-scrollbar-thumb{background:var(--gd);border-radius:3px}
</style>
</head>
<body>

<script type="text/babel">
const { useState, useEffect } = React;

const CHECKS = [
  {id:"mobile",label:"Mobile?",cat:"Design"},
  {id:"logo",label:"Logo?",cat:"Design"},

  {id:"darklight",label:"Botão Dark/Light?",cat:"Funcionalidade"},

  {id:"whatsapp",label:"Pub. WhatsApp?",cat:"Marketing"},

const TYPES = ["APP","SITE","SAAS","LANDING PAGE"];

const newProj = () => ({
  id: Date.now().toString(),
  title:"",area:"",type:"SITE",url:"",repo:"",deploy:"",ia:"",email:"",
  createdAt: new Date().toISOString().split("T")[0],
  checklist: CHECKS.map(c=>({...c,status:null,obs:""})),
  notes:"",pages:"",status:"Em Andamento"
});

const prog = cl => Math.round((cl.filter(i=>i.status==="yes").length/cl.length)*100);
const fmtDate = d => { if(!d) return "—"; const[y,m,dd]=d.split("-"); return `${dd}/${m}/${y}`; };
const statusCls = s => s==="Rodando"?"s-run":s==="Pausado"?"s-pau":"s-prog";

const SvgCheck = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>);

const SvgSearch = () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>);

const SvgGrid = () => (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>);
const SvgUser = () => (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>);
const SvgMail = () => (<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>);
const SvgPhone = () => (<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 8.81 19.79 19.79 0 01.22 2.18 2 2 0 012.18 0h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.91 7.91a16 16 0 006.18 6.18l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg>);
const SvgLI = () => (<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>);
const SvgGlobe = () => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>);
const SvgSave = () => (<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>);

function App() {
  const [tab, setTab] = useState("dashboard");
  const [projects, setProjects] = useState(() => { try { return JSON.parse(localStorage.getItem("lc_proj")||"[]"); } catch { return []; } });
  const [modal, setModal] = useState(null);
  const [cur, setCur] = useState(null);
  const [search, setSearch] = useState("");
  const [fType, setFType] = useState("Todos");
  const [fStatus, setFStatus] = useState("Todos");
  const [confirm, setConfirm] = useState(null);
  const [toast, setToast] = useState(null);

  const save = list => { localStorage.setItem("lc_proj", JSON.stringify(list)); setProjects(list); };
  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(null), 3000); };

  const openNew = () => { setCur(newProj()); setModal("new"); };
  const openEdit = (p,e) => { e&&e.stopPropagation(); setCur({...p,checklist:p.checklist.map(i=>({...i}))}); setModal("edit"); };
  const openView = p => { setCur(p); setModal("view"); };
  const close = () => { setModal(null); setCur(null); };

  const saveProj = () => {
    if (!cur.title.trim()) { showToast("⚠ Informe o título"); return; }
    const list = modal==="new" ? [cur,...projects] : projects.map(p=>p.id===cur.id?cur:p);
    save(list); close();
    showToast(modal==="new"?"✓ Projeto criado!":"✓ Projeto salvo!");
  };

  const delProj = id => setConfirm({ onOk: () => { save(projects.filter(p=>p.id!==id)); setConfirm(null); showToast("Projeto removido."); } });

  const upd = (f,v) => setCur(c=>({...c,[f]:v}));
  const updCL = (idx,f,v) => setCur(c=>({...c,checklist:c.checklist.map((it,i)=>i===idx?{...it,[f]:v}:it)}));

  const filtered = projects.filter(p => {
    const ms = p.title.toLowerCase().includes(search.toLowerCase())||(p.area||"").toLowerCase().includes(search.toLowerCase());
    const mt = fType==="Todos"||p.type===fType;
    const mst = fStatus==="Todos"||p.status===fStatus;
    return ms&&mt&&mst;
  });

  const total=projects.length;
  const running=projects.filter(p=>p.status==="Rodando").length;
  const avgP=total?Math.round(projects.reduce((s,p)=>s+prog(p.checklist),0)/total):0;
  const types=[...new Set(projects.map(p=>p.type))].length;

  return (
    <div style={{display:"flex",flexDirection:"column",minHeight:"100vh"}}>
      {/* NAV */}
      <nav className="nav">
        <div className="logo">LC <span>Consultoria</span></div>
        <div className="nav-tabs">
          {[["dashboard","Dashboard"],["about","Sobre"]].map(([t,l])=>(
            <button key={t} className={`nav-tab${tab===t?" active":""}`} onClick={()=>setTab(t)}>{l}</button>
          ))}
        </div>
        <button className="btn-new" onClick={openNew}><SvgPlus /> Novo Projeto</button>
      </nav>

      {/* MAIN */}
      <main>
        {tab==="dashboard" && <>
          <div className="stats">
            {[[total,"Total de Projetos"],[running,"Em Produção"],[`${avgP}%`,"Progresso Médio"],[types||0,"Tipos Distintos"]].map(([v,l],i)=>(
              <div className="stat" key={i}><div className="stat-v">{v}</div><div className="stat-l">{l}</div></div>
            ))}
          </div>
          <div className="filter-bar">
            <div className="search-wrap">
              <SvgSearch/>
              <input className="search-inp" placeholder="Buscar projeto..." value={search} onChange={e=>setSearch(e.target.value)}/>
            </div>
            <select className="fsel" value={fType} onChange={e=>setFType(e.target.value)}>
              <option>Todos</option>{TYPES.map(t=><option key={t}>{t}</option>)}
            </select>
            <select className="fsel" value={fStatus} onChange={e=>setFStatus(e.target.value)}>
              {["Todos","Em Andamento","Rodando","Pausado"].map(s=><option key={s}>{s}</option>)}
            </select>
          </div>
          <div className="grid">
            {filtered.length===0 ? (
              <div className="empty">
                <div style={{fontSize:"3rem",color:"var(--g)",opacity:.3}}>◈</div>
                <div className="empty-t">{projects.length===0?"Nenhum projeto ainda":"Sem resultados"}</div>
                <div style={{fontSize:".85rem"}}>{projects.length===0?'Clique em "Novo Projeto" para começar!':'Ajuste os filtros.'}</div>
              </div>
            ) : filtered.map(p=>{
              const pct=prog(p.checklist);
              return (
                <div className="card" key={p.id} onClick={()=>openView(p)}>
                  <div className="card-top">
                    <span className="type-badge">{p.type}</span>
                    <div className="card-acts" onClick={e=>e.stopPropagation()}>
                      <button className="act-btn" title="Editar" onClick={e=>openEdit(p,e)}><SvgEdit/></button>
                      <button className="act-btn del" title="Excluir" onClick={e=>{e.stopPropagation();delProj(p.id)}}><SvgTrash/></button>
                    </div>
                  </div>
                  <div className="card-title">{p.title}</div>
                  <div className="card-area">{p.area||"—"}</div>
                  <div className="plbl"><span>Checklist</span><span>{pct}%</span></div>
                  <div className="ptrack"><div className="pfill" style={{width:`${pct}%`}}/></div>
                  <div><span className={`sbadge ${statusCls(p.status)}`}><span className="dot"/>  {p.status}</span></div>
                  <div className="card-meta">
                    {p.ia&&<span>{p.ia}</span>}
                    <span style={{marginLeft:"auto"}}>{fmtDate(p.createdAt)}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </>}
        {tab==="about" && <AboutPage/>}
      </main>

      {/* MOBILE NAV */}
      <div className="mob-nav">
        {[["dashboard","Dashboard",<SvgGrid/>],["about","Sobre",<SvgUser/>]].map(([t,l,ic])=>(
          <button key={t} className={`mob-btn${tab===t?" active":""}`} onClick={()=>setTab(t)}>{ic}{l}</button>
        ))}
        <button className="mob-btn" style={{color:"var(--g)"}} onClick={openNew}><SvgPlus/>Novo</button>
      </div>

      {/* FOOTER */}
      <footer className="footer">
        <div><span className="footer-b">LC Consultoria de Negócios</span><span style={{marginLeft:12}}>© {new Date().getFullYear()}</span></div>
        <div style={{display:"flex",gap:16}}>
          <span>contato@lcconsultorianegocios.com.br</span>
          <span>(21) 98482-1444</span>
        </div>
      </footer>

      {/* FORM MODAL */}
      {(modal==="new"||modal==="edit")&&cur&&(
        <div className="overlay" onClick={e=>e.target===e.currentTarget&&close()}>
          <div className="modal">
            <div className="mhead">
              <div className="mtitle">{modal==="new"?"Novo Projeto":"Editar Projeto"}</div>
              <button className="mclose" onClick={close}><SvgX/></button>
            </div>
            <div className="mbody">
              <div className="fsec">
                <div className="fsec-t">Detalhes Gerais</div>
                <div className="fgrid">
                  <div className="fgrp" style={{gridColumn:"1/-1"}}>
                    <label className="flbl">Título *</label>
                    <input className="finp" value={cur.title} onChange={e=>upd("title",e.target.value)} placeholder="Ex: GastroMetrics SaaS"/>
                  </div>
                  <div className="fgrp"><label className="flbl">Área</label><input className="finp" value={cur.area} onChange={e=>upd("area",e.target.value)} placeholder="Ex: Saúde, Educação..."/></div>
                  <div className="fgrp"><label className="flbl">Tipo</label><select className="fsel2" value={cur.type} onChange={e=>upd("type",e.target.value)}>{TYPES.map(t=><option key={t}>{t}</option>)}</select></div>
                  <div className="fgrp"><label className="flbl">Status</label><select className="fsel2" value={cur.status} onChange={e=>upd("status",e.target.value)}>{["Em Andamento","Rodando","Pausado"].map(s=><option key={s}>{s}</option>)}</select></div>
                  <div className="fgrp"><label className="flbl">Data Início</label><input type="date" className="finp" value={cur.createdAt} onChange={e=>upd("createdAt",e.target.value)}/></div>
                  <div className="fgrp"><label className="flbl">IA Utilizada</label><select className="fsel2" value={cur.ia} onChange={e=>upd("ia",e.target.value)}><option value="">Selecione...</option>{IA_OPTS.map(o=><option key={o}>{o}</option>)}</select></div>
                  <div className="fgrp"><label className="flbl">URL do Site</label><input className="finp" value={cur.url} onChange={e=>upd("url",e.target.value)} placeholder="https://..."/></div>
                  <div className="fgrp"><label className="flbl">Repositório</label><input className="finp" value={cur.repo} onChange={e=>upd("repo",e.target.value)} placeholder="github.com/..."/></div>
                  <div className="fgrp"><label className="flbl">Deploy</label><select className="fsel2" value={cur.deploy} onChange={e=>upd("deploy",e.target.value)}><option value="">Selecione...</option>{DEPLOY_OPTS.map(o=><option key={o}>{o}</option>)}</select></div>
                  <div className="fgrp"><label className="flbl">E-mail</label><input className="finp" value={cur.email} onChange={e=>upd("email",e.target.value)} placeholder="projeto@email.com"/></div>
                </div>
              </div>
              <div className="fsec">
                <div className="fsec-t">Páginas Presentes</div>
                <textarea className="ftxt" value={cur.pages} onChange={e=>upd("pages",e.target.value)} placeholder="Ex: Home, Dashboard, Login, Sobre, Contato..."/>
              </div>
              <div className="fsec">
                <div className="fsec-t">Lista de Verificação — {prog(cur.checklist)}% Completo</div>
                <div className="ptrack" style={{marginBottom:14}}><div className="pfill" style={{width:`${prog(cur.checklist)}%`}}/></div>
                <div className="cl-wrap">
                  <table className="cl-table">
                    <thead><tr><th>#</th><th>Item</th><th>Categoria</th><th style={{textAlign:"center"}}>S / N</th><th>Observação</th></tr></thead>
                    <tbody>
                      {cur.checklist.map((it,idx)=>(
                        <tr key={it.id}>
                          <td style={{color:"var(--gray)",fontSize:".7rem"}}>{idx+1}</td>
                          <td style={{fontWeight:600,color:"var(--w2)",whiteSpace:"nowrap"}}>{it.label}</td>
                          <td><span className="cat-b">{it.cat}</span></td>
                          <td>
                            <div className="sb-wrap">
                              <button className={`sb sb-y${it.status==="yes"?" on":""}`} onClick={()=>updCL(idx,"status",it.status==="yes"?null:"yes")}><SvgCheck/></button>
                              <button className={`sb sb-n${it.status==="no"?" on":""}`} onClick={()=>updCL(idx,"status",it.status==="no"?null:"no")}><SvgX/></button>
                            </div>
                          </td>
                          <td><input className="obs-i" value={it.obs} onChange={e=>updCL(idx,"obs",e.target.value)} placeholder="Nota..."/></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
              <div className="fsec">
                <div className="fsec-t">Notas Adicionais</div>
                <textarea className="ftxt" value={cur.notes} onChange={e=>upd("notes",e.target.value)} placeholder="Observações, links, decisões técnicas..." style={{minHeight:100}}/>
              </div>
            </div>
            <div className="mfoot">
              <button className="btn btn-o" onClick={close}><SvgX/> Cancelar</button>
              <button className="btn btn-g" onClick={saveProj}><SvgSave/> {modal==="new"?"Criar Projeto":"Salvar"}</button>
            </div>
          </div>
        </div>
      )}

      {/* VIEW MODAL */}
      {modal==="view"&&cur&&(
        <div className="overlay" onClick={e=>e.target===e.currentTarget&&close()}>
          <div className="modal">
            <div className="mhead">
              <div>
                <div style={{fontSize:".63rem",letterSpacing:".15em",color:"var(--g)",textTransform:"uppercase",fontWeight:700,marginBottom:4}}>{cur.type}</div>
                <div className="mtitle">{cur.title}</div>
              </div>
              <div style={{display:"flex",gap:8}}>
                <button className="btn btn-o" style={{padding:"8px 14px"}} onClick={()=>openEdit(cur)}><SvgEdit/> Editar</button>
                <button className="mclose" onClick={close}><SvgX/></button>
              </div>
            </div>
            <div className="mbody">
              {/* Progress summary */}
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:20}}>
                {[[`${prog(cur.checklist)}%`,"Concluído","var(--g)"],[cur.checklist.filter(i=>i.status==="yes").length,"Sim ✓","#27ae60"],[cur.checklist.filter(i=>i.status==="no").length,"Não ✗","#e74c3c"],[cur.checklist.filter(i=>!i.status).length,"Pendente","var(--gray)"]].map(([v,l,c],i)=>(
                  <div key={i} style={{background:"var(--b4)",border:"1px solid var(--bd)",borderRadius:7,padding:"12px 14px"}}>
                    <div style={{fontFamily:"Cormorant Garamond,serif",fontSize:"1.6rem",fontWeight:700,color:c,lineHeight:1}}>{v}</div>
                    <div style={{fontSize:".63rem",color:"var(--gray)",fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",marginTop:3}}>{l}</div>
                  </div>
                ))}
              </div>
              <div className="ptrack" style={{marginBottom:24}}><div className="pfill" style={{width:`${prog(cur.checklist)}%`}}/></div>
              <div className="view-grid">
                {[["Área",cur.area||"—"],["IA",cur.ia||"—"],["Deploy",cur.deploy||"—"],["Início",fmtDate(cur.createdAt)],["Status",cur.status],["E-mail",cur.email||"—"]].map(([l,v],i)=>(
                  <div className="view-item" key={i}><div className="view-lbl">{l}</div><div className="view-val">{v}</div></div>
                ))}
              </div>
              {cur.url&&<div style={{marginBottom:20}}><div className="view-lbl">URL</div><a href={cur.url} target="_blank" rel="noreferrer" style={{color:"var(--g)",fontSize:".85rem",display:"flex",alignItems:"center",gap:6}}><SvgGlobe/>{cur.url}</a></div>}
              {cur.repo&&<div style={{marginBottom:20}}><div className="view-lbl">Repositório</div><a href={`https://${cur.repo.replace(/^https?:\/\//,"")}`} target="_blank" rel="noreferrer" style={{color:"var(--g)",fontSize:".85rem"}}>{cur.repo}</a></div>}
              <div style={{height:1,background:"linear-gradient(90deg,transparent,var(--g),transparent)",margin:"20px 0"}}/>
              <div style={{marginBottom:20}}><div className="fsec-t" style={{marginBottom:14}}>Lista de Verificação</div>
                <table className="cl-table">
                  <thead><tr><th>Item</th><th>Cat.</th><th style={{textAlign:"center"}}>Status</th><th>Obs.</th></tr></thead>
                  <tbody>
                    {cur.checklist.map(it=>(
                      <tr key={it.id}>
                        <td style={{fontWeight:600,fontSize:".82rem",color:"var(--w2)"}}>{it.label}</td>
                        <td><span className="cat-b">{it.cat}</span></td>
                        <td style={{textAlign:"center"}}>
                          {it.status==="yes"&&<span style={{color:"#27ae60",fontSize:".72rem",fontWeight:700}}>✓ SIM</span>}
                          {it.status==="no"&&<span style={{color:"#e74c3c",fontSize:".72rem",fontWeight:700}}>✗ NÃO</span>}
                          {!it.status&&<span style={{color:"var(--gray)",fontSize:".72rem"}}>—</span>}
                        </td>
                        <td style={{fontSize:".78rem",color:"var(--gray-l)"}}>{it.obs||"—"}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              {cur.pages&&<div style={{marginBottom:16}}><div className="view-lbl" style={{marginBottom:6}}>Páginas</div><div style={{fontSize:".85rem",color:"var(--w2)",lineHeight:1.7}}>{cur.pages}</div></div>}
              {cur.notes&&<div><div className="view-lbl" style={{marginBottom:6}}>Notas</div><div style={{fontSize:".85rem",color:"var(--w2)",lineHeight:1.7,whiteSpace:"pre-wrap"}}>{cur.notes}</div></div>}
            </div>
            <div className="mfoot">
              <button className="btn btn-o" onClick={close}>Fechar</button>
              <button className="btn btn-g" onClick={()=>openEdit(cur)}><SvgEdit/> Editar</button>
            </div>
          </div>
        </div>
      )}

      {/* CONFIRM */}
      {confirm&&(
        <div className="conf-ov">
          <div className="conf-box">
            <div className="conf-t">Excluir Projeto?</div>
            <div className="conf-m">Esta ação não pode ser desfeita.</div>
            <div className="conf-btns">
              <button className="btn btn-o" onClick={()=>setConfirm(null)}>Cancelar</button>
              <button className="btn btn-d" onClick={confirm.onOk}>Excluir</button>
            </div>
          </div>
        </div>
      )}

      {/* TOAST */}
      {toast&&<div className="toast">{toast}</div>}
    </div>
  );
}

function AboutPage() {
  return (
    <div>
      <div className="about-hero">
        <div className="photo-wrap">
          <img src="https://i.imgur.com/placeholder.png" alt="Lienys Carvalho" className="photo"

          <div style={{width:"100%",height:"100%",background:"var(--b3)",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--g)",fontSize:"3rem"}}>LC</div>

          </div>
          <div className="contacts">
            <a className="clink" href="mailto:contato@lcconsultorianegocios.com.br"><SvgMail/>contato@lcconsultorianegocios.com.br</a>
            <a className="clink" href="https://wa.me/5521984821444" target="_blank" rel="noreferrer"><SvgPhone/>(21) 98482-1444</a>
            <a className="clink" href="https://www.linkedin.com/in/lienyscarvalho/" target="_blank" rel="noreferrer"><SvgLI/>LinkedIn</a>
          </div>
        </div>
      </div>
      <div className="sec-t">Competências & <span>Especialidades</span></div>
      <div className="skills-grid">
        {[

          {t:"Formação",tags:["MBA IA (FIASP)","MBA Auditoria","Pós Compliance PUC/MG","Pós Projetos Ágeis"]},

          <div className="skill-card" key={i}>
            <div className="skill-t">{s.t}</div>
            {s.tags.map(t=><span className="stag" key={t}>{t}</span>)}
          </div>
        ))}
      </div>
      <div className="gold-div"/>
      <div className="sec-t" style={{marginBottom:20}}>Experiência <span>Profissional</span></div>
      {[
        {co:"Serede Serviços de Rede S/A",per:"2012–2024",roles:"Gerente Corporativo de Auditorias · Coord. Geral · Coord. de Auditorias · PMO · T&D",hl:"Liderança na Copa do Mundo 2014 — infraestrutura de telecom para todos os estádios envolvidos."},
        {co:"Nokia Siemens Networks",per:"2008–2012",roles:"Auditor de Qualidade",hl:"Criação do Projeto de Formação de Líderes NSN e implantação do Sistema Integrado de Gestão da Qualidade (SIGQ)."},
      ].map((e,i)=>(
        <div className="exp-card" key={i}>
          <div className="exp-top"><div className="exp-co">{e.co}</div><div className="exp-per">{e.per}</div></div>
          <div style={{fontSize:".78rem",color:"var(--gray)",marginBottom:8}}>{e.roles}</div>
          <div className="exp-hl">⭐ {e.hl}</div>
        </div>
      ))}
      <div className="gold-div"/>
      <div style={{textAlign:"center",padding:"20px 0"}}>
        <div style={{fontFamily:"Cormorant Garamond,serif",fontSize:"1.1rem",color:"var(--g)",marginBottom:16}}>LC Consultoria de Negócios</div>
        <div className="contacts" style={{justifyContent:"center"}}>
          <a className="clink" href="mailto:contato@lcconsultorianegocios.com.br"><SvgMail/>contato@lcconsultorianegocios.com.br</a>
          <a className="clink" href="https://wa.me/5521984821444" target="_blank" rel="noreferrer"><SvgPhone/>(21) 98482-1444</a>
          <a className="clink" href="https://www.linkedin.com/in/lienyscarvalho/" target="_blank" rel="noreferrer"><SvgLI/>linkedin.com/in/lienyscarvalho</a>

}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
